name: Deploy to cPanel

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via webhook
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          BODY='{}'
          SIG="sha256=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" | awk '{print $2}')"
          HTTP=$(curl -s -o /tmp/resp.txt -w "%{http_code}" \
            -X POST https://dewanlabung.com.np/webhook/deploy \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIG" \
            -d "$BODY")
          cat /tmp/resp.txt
          echo "HTTP status: $HTTP"
          echo "$HTTP" | grep -qE '^2' || { echo "Deploy failed"; exit 1; }
