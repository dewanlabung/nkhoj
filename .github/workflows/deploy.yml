name: Deploy to cPanel

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger webhook deploy
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://dewanlabung.com.np/webhook/deploy \
            -H "Content-Type: application/json" \
            -d "{\"secret\": \"${{ secrets.DEPLOY_SECRET }}\"}" \
          | grep -qE '^2' || { echo "Webhook deploy failed"; exit 1; }
