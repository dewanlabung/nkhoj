name: Deploy to cPanel

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via webhook
        run: |
          curl -v -X POST https://dewanlabung.com.np/webhook/deploy \
            -H "Content-Type: application/json" \
            -d '{"ref":"refs/heads/master"}' 2>&1 | tail -40
